framework:
  website: coast.swlkr.com
  github: coast-framework/coast
  version: 1.0

  environment:
    COAST_ENV: prod

  build:
    - mkdir classes && clj -e "(compile 'server)" && clojure -Auberjar --main-class server

  binaries:
    - coast.jar

language:
  engines:
    default:
      command: java -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dclojure.compiler.direct-linking=true -Dcoast.env=production -jar coast.jar 3000
