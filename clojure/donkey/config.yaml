framework:
  github: AppsFlyer/donkey
  version: 0.5

  build:
    - lein uberjar

  binaries:
    - target/uberjar/donkey.jar

language:
  compiler: lein
  engines:
    default:
      command: java -Xms2G -Xmx2G -server -XX:+UseStringDeduplication -XX:+UseParallelGC -XX:GCTimeRatio=4 -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dvertx.disableMetrics=true -Dvertx.threadChecks=false -Dvertx.disableContextTimings=true -Dvertx.disableTCCL=true -Dvertx.disableH2c=true -Dvertx.disableWebsockets=true -Dvertx.disableHttpHeadersValidation=true -Dvertx.flashPolicyHandler=false -Djava.net.preferIPv4Stack=true -Ddonkey.env=production -jar target/uberjar/donkey.jar 3000
