name: Request framework reviewers

on:
  pull_request_target:
    branches: [develop]
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-reviewers:
    # Release PRs target master; skip the reverse sync into develop as well.
    if: >-
      ${{ !(github.event.pull_request.head.ref == 'master' &&
            github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Request configured reviewers
        run: node .github/scripts/request-reviewers.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
