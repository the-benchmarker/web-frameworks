name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: File changes
        uses: trilom/file-changes-action@v1.2.4
        id: file_changes

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Install deps
        run: bundle install --jobs 4 --retry 3

      - name: Set matrix
        id: set-matrix
        run: echo "matrix=$(bundle exec rake ci:languages)" >> "$GITHUB_OUTPUT"
        env:
          FILES: ${{ steps.file_changes.outputs.files }}

  frameworks:
    needs: languages
    if: ${{ fromJson(needs.languages.outputs.matrix).language[0] != null }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.languages.outputs.matrix) }}

    uses: ./.github/workflows/test-framework.yml
    with:
      language: ${{ matrix.language }}
