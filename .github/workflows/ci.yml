name: CI

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.file_changes.outputs.files }}
      languages: ${{ steps.set-languages.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: File changes
        uses: trilom/file-changes-action@v1.2.4
        id: file_changes
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Install deps
        run: bundle install --jobs 4 --retry 3
      - name: Set languages
        id: set-languages
        run: echo "languages=$(bundle exec rake ci:languages)" >> "$GITHUB_OUTPUT"
        env:
          FILES: ${{ steps.file_changes.outputs.files }}

  frameworks:
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.languages) }}
    uses: ./.github/workflows/ci-language.yml
    with:
      language: ${{ matrix.language }}
      files: ${{ needs.changes.outputs.files }}
