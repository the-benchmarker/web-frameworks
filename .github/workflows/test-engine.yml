name: Test Engine

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      framework:
        required: true
        type: string

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Install deps
        run: bundle install --jobs 4 --retry 3

      - name: Set matrix
        id: set-matrix
        run: echo "matrix=$(bundle exec rake ci:engines)" >> "$GITHUB_OUTPUT"
        env:
          LANGUAGE: ${{ inputs.language }}
          FRAMEWORK: ${{ inputs.framework }}

  test:
    needs: engines
    if: ${{ fromJson(needs.engines.outputs.matrix).engine[0] != null }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.engines.outputs.matrix) }}

    name: "${{ inputs.language }} / ${{ inputs.framework }} / ${{ matrix.engine }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Install deps
        run: bundle install --jobs 4 --retry 3

      - name: Docker version
        run: docker -v

      - name: Configure
        run: bundle exec rake config

      - name: Build
        run: make "build" -f "${DIRECTORY}/.Makefile"
        env:
          DIRECTORY: ${{ inputs.language }}/${{ inputs.framework }}
          ENGINE: ${{ matrix.engine }}

      - name: Wait for framework HTTP readiness
        run: |
          IP_FILE="${{ inputs.language }}/${{ inputs.framework }}/ip-${{ matrix.engine }}.txt"
          CID_FILE="${{ inputs.language }}/${{ inputs.framework }}/cid-${{ matrix.engine }}.txt"
          IP=$(cat $IP_FILE | tr -d '[:space:]')

          echo "Waiting for http://$IP:3000/ to respond (timeout 120s)..."

          SECONDS_WAITED=0
          MAX_WAIT=120

          until curl -s -f "http://$IP:3000/" > /dev/null; do
            sleep 1
            SECONDS_WAITED=$((SECONDS_WAITED+1))
            if [ $SECONDS_WAITED -ge $MAX_WAIT ]; then
              echo "Container did not become ready in $MAX_WAIT seconds!"
              echo "---- Container logs ----"
              docker logs $(cat $CID_FILE) || true
              exit 1
            fi
          done

      - name: Test
        run: bundle exec rspec .spec
        env:
          LANGUAGE: ${{ inputs.language }}
          FRAMEWORK: ${{ inputs.framework }}
          ENGINE: ${{ matrix.engine }}
