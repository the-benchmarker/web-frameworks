[package]
name = "server"
version = "0.0.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
tako-rs = { version = "2.4", features = ["per-thread"] }
