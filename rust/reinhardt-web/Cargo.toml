[package]
name = "server"
version = "0.0.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[features]
default = []
management = ["reinhardt/conf", "dep:reinhardt-commands", "dep:serde"]

[[bin]]
name = "manage"
path = "src/bin/manage.rs"
required-features = ["management"]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
reinhardt = { version = "0.3.0", package = "reinhardt-web", default-features = false, features = ["minimal"] }
reinhardt-commands = { version = "0.3.0", default-features = false, features = ["server"], optional = true }
ctor = "0.13"
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
