[package]
name = "server"
version = "0.0.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
reinhardt = { package = "reinhardt-web", version = "0.3.0", default-features = false, features = ["minimal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
