[package]
name = "server"
version = "0.0.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
# Web framework
axum = "0.8"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

# System utilities
num_cpus = "1.16"
