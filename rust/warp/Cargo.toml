[package]
name = "server"
version = "0.0.0"
edition = "2021"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
# Web framework
warp = { version = "0.4", features = ["server"] }

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"
