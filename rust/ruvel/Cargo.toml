[package]
name = "server"
version = "0.1.0"
edition = "2024"
authors = ["Stephan Munde <mundestpehane13@gmail.com>"]

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[[bin]]
name = "server"
path = "main.rs"

[dependencies]
async-trait = "0.1.92"
ruvel = "0.1.1"
tokio = { version = "1.54.1", features = ["full"] }

[lints.clippy]
async_fn_in_trait = "allow"
