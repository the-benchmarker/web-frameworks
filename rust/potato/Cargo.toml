[package]
name = "server"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
anyhow = "1"
potato = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
