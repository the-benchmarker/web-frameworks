[package]
name = "server"
version = "0.0.0"
edition = "2021"
publish = false

# 本目录是独立构建单元（无上游 workspace）；空表声明避免被外层 workspace 吸收
[workspace]

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
# 宏展开内部引用 anyhow，消费端需保证其可见
anyhow = "1"
potato = { version = "0.4.7", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
