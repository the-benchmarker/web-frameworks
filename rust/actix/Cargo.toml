[package]
name = "server"
version = "0.0.0"
authors = [
    "Oisín Mac Fhearaí <denpashogai@gmail.com>",
    "Rob Ede <robjtede@icloud.com>",
]
edition = "2018"

[dependencies]
# Web framework
actix-web = "4.8"

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# System utilities
num_cpus = "1.16"
once_cell = "1.18"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false
