[package]
name = "server"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false

[dependencies]
zenocore = "0.2.3"
zenoengine = "0.2.3"
zeno-std = "0.2.3"
matchit = "0.9"
actix-web = "4"

