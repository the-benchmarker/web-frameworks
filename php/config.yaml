language:
  version: 8.5

  files:
    - "**/*.php"
    - composer.json
    - php.ini

  bootstrap:
    - composer install --no-dev --prefer-dist --classmap-authoritative
    - composer dumpautoload -o

  engines:
    php-fpm:
      deps:
        - nginx
    workerman:
      before_build:
        - docker-php-ext-install pcntl sockets
      extensions:
        - osmanov/pecl-event
      deps:
        - libevent-dev
        - libssl-dev
      bootstrap:
        - php -r \
          "if (extension_loaded('event')) {echo 'Event extension is loaded.'; }"
      command: php public/index.php start
    road-runner:
      extensions:
        - extport/protobuf
      files:
        - .rr.yaml
      bootstrap:
        - vendor/bin/rr get-binary
      modules:
        - sockets
      command: ./rr serve
    swoole:
      extensions:
        - swoole/swoole
      command: php public/index.php
      build_deps:
        - libbrotli-dev
        - libssl-dev
    reactphp:
      modules:
        - sockets
      extensions:
        - osmanov/pecl-event
      deps:
        - libevent-dev
        - libicu-dev
        - libssl-dev
      bootstrap:
        - php -r \
          "if (extension_loaded('event')) {echo 'Event extension is loaded.'; }"
    adapterman:
      before_build:
        - docker-php-ext-install pcntl sockets
      extensions:
        - osmanov/pecl-event
      deps:
        - libevent-dev
        - libssl-dev
      bootstrap:
        - php -r \
          "if (extension_loaded('event')) {echo 'Event extension is loaded.'; }"
      command: php server.php start

framework:
  engines:
    - php-fpm
