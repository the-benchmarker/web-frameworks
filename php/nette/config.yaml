framework:
  website: nette.org/en/
  version: 3.3

  files:
    - app/config/common.neon

  bootstrap:
    - mkdir -p temp/cache
    - chmod 777 -R temp

  nginx_conf:
    - |
      location / {
          try_files $uri $uri/ /index.php;
          fastcgi_pass unix:/var/run/php-fpm.sock;
          fastcgi_param   SCRIPT_FILENAME     $document_root/index.php;
          include fastcgi_params;
      }
