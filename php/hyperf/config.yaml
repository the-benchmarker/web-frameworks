specs: v1

reviewers:
  - limingxinleo
  - huangzhhui

framework:
  website: hyperf.io
  version: 3.1

  engines:
    - swoole

  extensions:
    - phpredis/phpredis

  modules:
    - pcntl

  bootstrap:
    - composer install --no-dev --prefer-dist --classmap-authoritative
    - composer dumpautoload -o
    - echo "swoole.use_shortname = 'Off'" >> /usr/local/etc/php/conf.d/docker-php-ext-swoole.ini
    - php sbin/hyperf.php
language:
  # Swoole does not support PHP 8.6 yet.
  version: "8.5"

  engines:
    swoole:
      command: php sbin/hyperf.php start
