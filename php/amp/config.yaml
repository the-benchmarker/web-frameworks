specs: v1

framework:
  github: amphp/http-server
  version: 3.4

  engines:
    - revolt

language:
  engines:
    revolt:
      modules:
        - pcntl
        - sockets
      deps:
        - libevent-dev
        - libssl-dev
      extensions:
        - osmanov/pecl-event
      command: php vendor/bin/cluster --workers $(nproc) --log error server.php
