framework:
  github: amphp/http-server
  version: 3.4

  engines:
    - amp

language:
  engines:
    amp:
      modules:
        - pcntl
        - sockets
      extensions:
        - osmanov/pecl-event
      deps:
        - libevent-dev
        - libssl-dev
      command: php vendor/bin/cluster --workers $(nproc) --log error server.php
