framework:
  name: giraffe
  github: https://github.com/giraffe-fsharp/Giraffe
  version: 6.0.0
  description: "Functional, composable micro web framework for F#"
  production_ready: true
  
features:
  - functional_composition
  - type_providers
  - routing
  - middleware
  - aspnetcore_integration
  
security:
  - security_headers: true
  - request_size_limit: 8MB
  - server_header_removed: true
  - error_handling: true
  
performance:
  - max_connections: 16384
  - optimized_build: true
  - deterministic_build: true
  
best_practices:
  - proper_error_handling: true
  - structured_logging: true
  - health_checks: true
  - environment_configuration: true
