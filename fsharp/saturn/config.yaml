framework:
  name: saturn
  website: https://saturnframework.org
  version: 0.14.0
  description: "Opinionated, web development framework for F#"
  production_ready: true
  
features:
  - opinionated_architecture
  - routing
  - middleware
  - giraffe_integration
  
security:
  - security_headers: true
  - request_size_limit: 8MB
  - server_header_removed: true
  - error_handling: true
  
performance:
  - max_connections: 16384
  - optimized_build: true
  - deterministic_build: true
  
best_practices:
  - proper_error_handling: true
  - structured_logging: true
  - health_checks: true
  - environment_configuration: true
