framework:
  website: rubyonrails.org
  version: 8.1
  
  # Production-grade Rails implementation covering categories 1, 3, 4, 5, 6
  # Category 1: Core Framework Requirements
  # Category 3: Performance & Scalability
  # Category 4: Security
  # Category 5: Data Management
  # Category 6: API & Integration
  
  # ==========================================================================
  # HTTP STANDARDS COMPLIANCE
  # ==========================================================================
  # This implementation follows HTTP standards as defined in:
  # - RFC 7230: HTTP/1.1 Message Syntax and Routing
  # - RFC 7231: Semantics and Content (Date, Server, Content-Type, Location, WWW-Authenticate)
  # - RFC 7232: Conditional Requests (ETag, Last-Modified, If-None-Match)
  # - RFC 7233: Range Requests (Accept-Ranges, Content-Range)
  # - RFC 7234: Caching (Cache-Control, Expires, Pragma, Vary)
  # - RFC 7235: Authentication (WWW-Authenticate)
  # - RFC 5789: PATCH Method
  # - RFC 6750: Bearer Token Usage (OAuth 2.0)
  # - RFC 6797: HSTS
  # - RFC 6454: CORS
  # - RFC 6962: Referrer-Policy
  # - RFC 7807: Problem Details
  # - RFC 8246: Immutable Responses
  
  # ==========================================================================
  # HEADER COMPLIANCE NOTES
  # ==========================================================================
  # Standard HTTP Headers (RFC 7230-7235):
  # - Date (RFC 7231 Section 7.1.1.1) - REQUIRED for all responses
  # - Server (RFC 7231 Section 7.4.2) - OPTIONAL, identifies the server
  # - Content-Length (RFC 7230 Section 3.3.2) - REQUIRED for responses with body
  # - Content-Type (RFC 7231 Section 3.1.1.5) - REQUIRED for responses with body
  # - Cache-Control (RFC 7234) - Controls caching behavior
  # - Location (RFC 7231) - REQUIRED for 201/3xx responses
  # - WWW-Authenticate (RFC 7235) - REQUIRED for 401/403 responses
  # - ETag (RFC 7232) - Entity tags for conditional requests
  # - Last-Modified (RFC 7232) - Last modification timestamp
  # - Expires (RFC 7234) - Expiration time for cached responses
  # - Vary (RFC 7231) - Indicates which headers affect caching
  # - Accept-Ranges (RFC 7233) - Indicates range request support
  # - Pragma (RFC 7234) - Backward compatibility for caching
  
  # Security Headers (Standardized or De Facto):
  # - Strict-Transport-Security (RFC 6797) - HSTS header
  # - Content-Security-Policy (W3C) - CSP to prevent XSS
  # - X-Frame-Options (De Facto) - Prevents clickjacking
  # - X-Content-Type-Options (De Facto) - Prevents MIME sniffing
  # - X-XSS-Protection (De Facto) - Enables browser XSS filter (deprecated by CSP)
  # - Referrer-Policy (W3C) - Controls referrer information
  # - Permissions-Policy (W3C) - Controls browser features
  # - Access-Control-Allow-* (W3C) - CORS headers
  
  # Note: All custom X- headers (X-Framework, X-Version, X-Request-Id) have been removed
  # for proxy compatibility per user requirement. These headers are not forwarded by
  # reverse proxies by default and can cause issues in production environments.
  
  # ==========================================================================
  # SECURITY BEST PRACTICES IMPLEMENTED
  # ==========================================================================
  # - HSTS with preload and subdomains (RFC 6797)
  # - SSL/TLS enforcement in production (RFC 2818)
  # - Secure parameter filtering (Rails built-in)
  # - CORS support with proper headers (RFC 6454)
  # - Content Security Policy (CSP) via frame-ancestors
  # - Bearer token authentication (RFC 6750)
  # - Sensitive data filtering in logs
  # - Strong parameters for mass assignment protection
  # - No custom X- headers for proxy compatibility
  # - Date header on all responses (RFC 7231 Section 7.1.1.1)
  # - WWW-Authenticate header for 401 responses (RFC 7235)
  # - ETag and Last-Modified headers (RFC 7232)
  # - Cache-Control headers (RFC 7234)
  
  # Available endpoints:
  #
  # Health Check
  # GET /health - Health check endpoint (200 OK, text/plain "OK")
  #
  # Category 3: Performance & Scalability
  # GET /api/v1/cached - Cached response with proper cache headers (200 OK)
  #
  # Category 4: Security
  # GET /api/v1/secure - Bearer token auth with WWW-Authenticate header (401/200)
  # GET /api/v1/protected - Protected resource with Bearer token (401/200)
  # OPTIONS / - CORS preflight (204 No Content)
  # OPTIONS /api/v1/db/users - CORS preflight for specific path (204 No Content)
  #
  # Category 5: Data Management (Database ORM)
  # POST /api/v1/db/users - Create user (201 Created with Location header)
  # GET /api/v1/db/users - List all users with pagination (200 OK)
  # GET /api/v1/db/users/:id - Get specific user (200 OK / 404 Not Found)
  # PATCH /api/v1/db/users/:id - Update user (200 OK / 404 / 422)
  # DELETE /api/v1/db/users/:id - Delete user (204 No Content / 404 Not Found)
  #
  # Category 6: API & Integration
  # GET /api/v1/json - JSON API information (200 OK)
  # GET /api/v1/external - External API simulation (200 OK)
  
  bootstrap:
    - mkdir -p storage
    - bundle exec rake db:migrate
    - mkdir -p tmp/pids

  build_deps:
    - libsqlite3-dev
    - libyaml-dev
    - pkg-config

  environment:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: fatal
    # Rails enables YJIT after the app has initialized
    RUBY_YJIT_ENABLE: 0
