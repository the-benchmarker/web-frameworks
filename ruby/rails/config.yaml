framework:
  website: rubyonrails.org
  version: 8.1
  
  # Minimal Rails implementation covering categories 1, 3, 4, 6
  # Category 1: Core Framework Requirements
  # Category 3: Performance & Scalability  
  # Category 4: Security
  # Category 6: API & Integration
  
  # Available endpoints:
  # GET / - Health check (Category 1: HTTP Foundation)
  # GET /user/:id - Get user ID (Category 1: Request Routing & Response Building)
  # POST /user - Register user (Category 1: HTTP Method Support)
  # GET /api/json - JSON API response (Category 6: API & Integration)
  # GET /api/external - External API simulation (Category 6: API & Integration)
  # GET /api/cached - Cached response (Category 3: Performance & Scalability)
  # GET /api/secure - Bearer token auth (Category 4: Security)
  # GET /api/protected - Protected endpoint (Category 4: Security)
  # POST /api/db/users - Create user in database (Category 5: Data Management)
  # GET /api/db/users - List all users from database (Category 5: Data Management)
  # GET /api/db/users/:id - Get specific user from database (Category 5: Data Management)
  
  bootstrap:
    - mkdir -p tmp/pids

  build_deps:
    - libsqlite3-dev
    - libyaml-dev
    - pkg-config

  environment:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: fatal
    # Rails enables YJIT after the app has initialized
    RUBY_YJIT_ENABLE: 0
