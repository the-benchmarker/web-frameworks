framework:
  website: rubyonrails.org
  version: 8.1
  
  # Workload description
  description: Comprehensive Rails API workload testing all framework features
  workload_type: api
  features:
    - routing
    - serialization
    - external_services
    - database_orm
    - caching
    - background_jobs
    - authentication
    - pagination
    - error_handling

  bootstrap:
    - mkdir -p tmp/pids
    - mkdir -p storage

  build_deps:
    - libsqlite3-dev
    - libyaml-dev
    - pkg-config
    - redis-server

  environment:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: fatal
    # Rails enables YJIT after the app has initialized
    RUBY_YJIT_ENABLE: 0
    REDIS_URL: redis://localhost:6379/1
