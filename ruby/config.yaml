language:
  version: '4.0'

  engines:
    puma:
      bootstrap:
        - bundle add puma
      command: bundle exec puma -C puma.rb
      environment:
        PORT: 3000
        PUMA_DISABLE_SSL: "1"
    falcon:
      bootstrap:
        - bundle add falcon
      environment:
        PORT: 3000
      command: bundle exec falcon host
      build_deps:
        - libssl-dev
    iodine:
      bootstrap:
        - bundle add iodine # --version 0.7.60
      command: bundle exec iodine
      environment:
        PORT: 3000
        IODINE_MTLS: "0"

framework:
  engines:
    - puma
    - iodine
    - falcon

  files:
    - "**/*.rb"
    - config/*.yml
    - Gemfile
    - Rakefile
    - config.ru
    - iodine.ru

  environment:
    RUBY_YJIT_ENABLE: 1
    RACK_ENV: production
    BUNDLE_WITHOUT: "development,test"
    SECRET_KEY_BASE: Awe$ome_Secret.
