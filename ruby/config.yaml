language:
  version: '4.0'

  engines:
    puma:
      bootstrap:
        - bundle add puma
      command: bundle exec puma -p 3000
    falcon:
      bootstrap:
        - bundle add falcon
      command: bundle exec falcon serve -p 3000
      build_deps:
        - libssl-dev
    iodine:
      bootstrap:
        - bundle add iodine
      command: bundle exec iodine -p 3000 -w $(nproc)

framework:
  engines:
    - puma
    - iodine
    - falcon

  files:
    - "**/*.rb"
    - config/*.yml
    - Gemfile
    - Rakefile
    - config.ru

  environment:
    RUBY_YJIT_ENABLE: 1
    RACK_ENV: production
    BUNDLE_WITHOUT: "development,test"
    SECRET_KEY_BASE: Awe$ome_Secret.
