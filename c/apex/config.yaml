framework:
  github: xdearboy/apex
  version: 1.3

  build_deps:
    - ca-certificates

  download:
    - wget -q https://github.com/xdearboy/apex/archive/refs/tags/v1.3.1.tar.gz -O apex.tar.gz
    - mkdir -p apex && tar xzf apex.tar.gz -C apex --strip-components=1
    - cd apex && make

  build:
    - make

  binaries:
    - simple
