framework:
  github: xdearboy/apex
  version: 1.2

  build_deps:
    - ca-certificates

  download:
    - wget -q https://github.com/xdearboy/apex/archive/refs/tags/v1.2.1.tar.gz -O apex.tar.gz
    - mkdir -p apex && tar xzf apex.tar.gz -C apex --strip-components=1
    - cd apex && make

  build:
    - make

  binaries:
    - simple
