specs: v1

framework:
  github: lpereira/lwan
  website: lwan.ws
  version: 0.7

  build_deps:
    - ca-certificates
    - cmake
    - pkg-config
    - zlib1g-dev

  bin_deps:
    - zlib1g

  download:
    - wget -q https://codeload.github.com/lpereira/lwan/tar.gz/refs/tags/v0.7 -O lwan.tar.gz
    - mkdir lwan && tar xzf lwan.tar.gz -C lwan --strip-components=1
    - cmake -S lwan -B lwan/build -DCMAKE_BUILD_TYPE=Release -DMTUNE_NATIVE=OFF
    - make -C lwan/build lwan-static

  build:
    - make

  binaries:
    - simple
