-- Servant framework configuration
-- Production-grade settings for the Servant web framework
framework:
  name: "servant"
  website: docs.servant.dev
  version: "0.20"
  
  -- Production settings
  production:
    port: 3000
    host: "0.0.0.0"
    timeout: 30
    max_request_size: 10485760
    environment: "production"
    
  -- Development settings
  development:
    port: 3000
    host: "localhost"
    timeout: 60
    max_request_size: 10485760
    environment: "development"
