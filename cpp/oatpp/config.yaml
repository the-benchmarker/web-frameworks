language:
  version: 17
  engines:
    default:
      command: /opt/web/build/oat_benchmark
framework:
  github: oatpp/oatpp
  version: 1.3

  build_deps:

  bin_deps:

  binaries:
    - build/oat_benchmark

  download:
    - git clone --depth=1 https://github.com/oatpp/oatpp.git -b 1.3.1
    - mkdir oatpp/build
    - cd oatpp/build && cmake -DOATPP_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release -DOATPP_BUILD_EXAMPLES=OFF ..
    - cd oatpp/build && make install -j $(nproc)

  build:
    - mkdir build
    - cd build && cmake -DOATPP_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release ..
    - cd build && make -j $(nproc)
