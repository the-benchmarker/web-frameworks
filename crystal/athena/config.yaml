framework:
  github: athena-framework/athena
  version: 0.21

  build_deps:
    - libmagic-dev
    - liblzma-dev
    - libbz2-dev

  runtime_deps:
    - libyaml-0-2
    - libmagic1

environment:
  ATHENA_ENV: production
  PORT: 3000
  HOST: 0.0.0.0
  WORKER_COUNT: 0

logging:
  level: none

security:
  debug: false
  secure_headers: true
