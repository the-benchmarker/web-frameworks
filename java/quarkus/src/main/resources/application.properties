# Application Configuration
quarkus.application.name=quarkus-benchmark
quarkus.application.version=1.0.0

# HTTP Server Configuration
quarkus.http.port=3000
quarkus.http.host=0.0.0.0
quarkus.http.max-request-size=10MB
quarkus.http.max-header-size=8KB
quarkus.http.max-parameters=1000
quarkus.http.max-form-attribute-size=10MB
quarkus.http.limits.max-body-size=10MB

# Netty Configuration
quarkus.netty.event-loop-threads=0
quarkus.netty.io-ratio=75

# Logging Configuration (Production-grade)
quarkus.log.level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."io.netty".level=WARN
quarkus.log.category."yolo".level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} - %s%e%n
quarkus.log.console.json=false
quarkus.log.console.color=false

# Security Configuration
quarkus.security.enabled=false

# Health Configuration
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.root-path=/health

# Performance Configuration
quarkus.thread-pool.core-threads=0
quarkus.thread-pool.max-threads=0

# Disable debug mode
quarkus.devservices.enabled=false
quarkus.live-reload.enabled=false
quarkus.banner.enabled=false

# Profile Configuration
%prod.quarkus.log.level=WARN
%prod.quarkus.log.console.enabled=false
%prod.quarkus.log.file.enabled=true
%prod.quarkus.log.file.path=/var/log/quarkus-benchmark.log
%prod.quarkus.log.file.rotation.max-file-size=100M
%prod.quarkus.log.file.rotation.max-backup-index=7

# JVM Configuration
%prod.quarkus.application.jvm-args=-Xmx2g,-Xms256m,-XX:+UseZGC,-XX:MaxRAMPercentage=80.0