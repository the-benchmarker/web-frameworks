framework:
  website: aspectran.com
  github: aspectran/aspectran
  version: "9.6"

  build:
    - mvn clean package

  files:
    - config/**/*

  static_files:
    - config/**/*

  binaries:
    - target/benchmark-jar-with-dependencies.jar

language:
  engines:
    default:
      command: /usr/bin/java -jar /opt/web/target/benchmark-jar-with-dependencies.jar /opt/web /config/aspectran-config.apon
