/http-listener:
  enabled: true
  host: "0.0.0.0"
  port: 3000

/core/name: restheart-benchmarker

/logging/log-level: "OFF"
/logging/requests-log-mode: 0

/fullAuthorizer/enabled: true

/ping/enabled: false
/xPoweredBy/enabled: false
/dateHeader/enabled: false

# responses are never compressed: the benchmark forbids Content-Encoding
/core/response-compression: false
