# Server Configuration
server.port=3000
server.address=0.0.0.0
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
server.max-http-header-size=8KB
server.max-http-request-size=10MB

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD:changeme}
spring.security.user.roles=ADMIN
security.ignored=/**

# Actuator Configuration (Production Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.git.mode=full
management.server.port=${server.port}
management.server.address=${server.address}

# Logging Configuration (Production-grade)
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.benchmark=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.charset.console=UTF-8

# Virtual Threads
spring.threads.virtual.enabled=true

# Performance Tuning
spring.mvc.async.request-timeout=30000
spring.mvc.throw-exception-if-no-handler-found=true

# Disable debug mode
spring.main.banner-mode=off
debug=false

# Application Properties
spring.application.name=benchmark-spring-boot
spring.profiles.active=prod
