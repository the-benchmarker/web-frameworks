# Application Configuration
micronaut.application.name=micronaut-benchmark
micronaut.application.version=1.0.0
micronaut.application.environment=prod

# Server Configuration
micronaut.server.port=3000
micronaut.server.host=0.0.0.0
micronaut.server.max-request-size=10MB
micronaut.server.max-header-size=8KB
micronaut.server.idle-timeout=0PT
micronaut.server.connection-timeout=30s
micronaut.server.cors.enabled=false
micronaut.server.thread-selection=IO

# Netty Server Configuration
micronaut.netty.event-loop-groups=0
micronaut.netty.server.io-ratio=75
micronaut.netty.server.worker-threads=0
micronaut.netty.server.event-loop-threads=0

# Logging Configuration (Production-grade)
logging.level.root=WARN
logging.level.io.micronaut=WARN
logging.level.io.netty=WARN
logging.level.com.example=WARN
logging.level.org.jboss=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.charset.console=UTF-8

# Security Configuration
micronaut.security.enabled=false
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false

# Health Configuration
micronaut.health.details-visible=ANONYMOUS

# Management Configuration
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Performance Configuration
micronaut.executor.threadfactory.daemon=true
micronaut.serde.skip-unknown=true

# AOT Configuration
micronaut.aot.enabled=true
micronaut.aot.optimize-service-loading=true

# Environment Configuration
micronaut.environments=prod

# JVM Configuration
jvm.args=-Xmx2g -Xms256m -XX:+UseZGC -XX:MaxRAMPercentage=80.0