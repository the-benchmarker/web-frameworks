framework:
  github: gabearro/cps-http
  website: github.com/gabearro/cps-http
  version: 1.0
  engines:
    - multithreaded

# The work-stealing runtime starts one I/O shard per worker. Each shard owns its
# event loop, router, listener, and connections; SO_REUSEPORT distributes
# accepts without putting a shared scheduler on the HTTP data path.
language:
  engines:
    multithreaded:
      command: /usr/src/app/server

# The suite's Nim image already adds release mode, speed optimization, and LTO.
# Danger mode removes runtime checks from the hot path, ARC avoids tracing-GC
# work, and native CPU tuning lets the compiler use the benchmark host ISA.
build_opts:
  - "-d:danger"
  - "--threads:on"
  - "--mm:arc"
  - "--passC:-march=native"
  - "--passC:-mtune=native"
