framework:
  github: kaitakeradiology/hashi
  website: kaitakeradiology.github.io/hashi
  version: 0.1
  engines:
    - default
  build_deps:
    - git
    - ca-certificates

# hashi targets Nimony, the Nim 3 compiler, which is pre-release: it has no
# release to download and no .nimble of its own, so it is cloned at a pinned
# commit and bootstrapped with this image's Nim 2, exactly as hashi's own CI
# does. The dependency is declared in server.nimble as usual and resolved by
# pnak, Nimony's package manager, which reads the same .nimble format and
# writes the module search path `nimony c` uses.
build_with:
  - git clone -q https://github.com/nim-lang/nimony /usr/src/nimony && git -C /usr/src/nimony checkout -q 927296de9e9b6d301c8db0b950b4581dc79c3cf0 && cd /usr/src/nimony && nim c -r src/hastur/hastur --release build all
  - /usr/src/nimony/bin/pnak fetch server.nimble

# `nimony c`, not `nim c`: the suite's default build line is Nim 2's.
# -d:release implies --opt:speed here.
build_command: /usr/src/nimony/bin/nimony c -d:release --out:/usr/src/app/server server.nim
