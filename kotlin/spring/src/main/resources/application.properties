# Production-grade Spring Boot configuration

# Server configuration
server.port=3000
server.address=0.0.0.0
server.error.whitelabel.enabled=false
server.max-http-header-size=8KB
server.max-http-request-size=1MB
server.connection-timeout=30000

# Logging configuration - ERROR level only for production
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR

# Thread configuration for optimal performance
spring.threads.virtual.enabled=true
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Security configuration
spring.main.banner-mode=off
spring.output.ansi.enabled=always

# Performance optimizations
spring.mvc.dispatch-options-request=true
spring.mvc.async.request-timeout=30000

# Jackson configuration (for JSON if used)
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
