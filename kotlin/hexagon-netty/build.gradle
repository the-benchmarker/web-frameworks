
plugins {
    id "org.jetbrains.kotlin.jvm" version "2.4.+"
}

ext {
    hexagonVersion = "3.7.4"
    gradleScripts = "https://raw.githubusercontent.com/hexagontk/hexagon/$hexagonVersion/gradle"
}

apply(from: "$gradleScripts/kotlin.gradle")
apply(from: "$gradleScripts/application.gradle")

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of("25"))
    }
    
    compilerOptions {
        allWarningsAsErrors = false
        freeCompilerArgs.addAll(["-Xjvm-default=all", "-opt"])
    }
}

defaultTasks("installDist")

application {
    mainClass.set("com.hexagonkt.BenchmarkKt")
}

dependencies {
    implementation("com.hexagonkt:http_server_netty:$hexagonVersion")
}

jarAll {
    archiveFileName = "server.jar"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

assemble.dependsOn("jarAll")

tasks.withType<KotlinCompile> {
    kotlinOptions {
        jvmTarget = "25"
    }
}
