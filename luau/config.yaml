language:
  name: Luau
  version: 1.0.0
  runtime: Luau VM
  description: Luau is a fast, small, safe scripting language derived from Lua, optimized for production use

  files:
    - "**/*.luau"

  engines:
    default:
      command: lute server.luau
      # Production command with debug disabled and security enforced

framework:
  engines:
    - default

# Production settings for Luau frameworks
production:
  # Debug and Development
  debug: false
  debug_distance: 0
  debug_linehook: false
  debug_sethook: false
  
  # Logging
  logging: false
  log_level: "none"
  log_output: "none"
  
  # Security
  security:
    enabled: true
    headers: true
    strict_mode: true
    sandbox_enabled: true
    input_validation: true
    error_handling: "secure"
    
  # Performance
  performance_optimized: true
  jit_enabled: true
  gc_pause: 200
  gc_step_mul: 200
  
  # Network
  keepalive: true
  keepalive_timeout: 75
  max_connections: 10000
  connection_timeout: 30
  
  # Compliance
  best_practices: true
  code_quality: "production"
  maintainability: "high"
