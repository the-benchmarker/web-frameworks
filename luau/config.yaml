language:
  name: Luau
  version: 1.0.0
  runtime: Luau VM
  description: Luau is a fast, small, safe scripting language derived from Lua

  files:
    - "**/*.luau"

  engines:
    default:
      command: lute server.luau
      # Production command with debug disabled

framework:
  engines:
    - default

# Production settings for Luau frameworks
production:
  debug: false
  logging: false
  security_headers: true
  performance_optimized: true
