# Production-grade Kossy framework configuration
# Security best practices, performance optimizations, and clean code

framework:
  github: kazeburo/Kossy
  version: 0.63

# Production settings
production:
  debug: false  # Disable debug mode
  show_errors: false  # Disable error display
  startup_info: false  # Disable startup information
  
# Security settings
security:
  enabled: true
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    x_xss_protection: "1; mode=block"
    content_security_policy: "default-src 'self'"
    cache_control: "max-age=3600"
  
# Performance settings
performance:
  max_request_size: 16777216  # 16MB
  workers: 100
  max_connections: 10000
  read_buffer_size: 8192
  write_buffer_size: 8192
