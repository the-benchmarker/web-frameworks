framework:
  name: plug_cowboy
  website: https://hexdocs.pm/plug
  version: 1.19.0
  description: "Plug web application on top of Cowboy"
  production_ready: true
  
features:
  - plug_router
  - cowboy_adapter
  - middleware_pipeline
  
security:
  - method_override_disabled: true
  - security_headers: true
  - body_size_limit: 8MB
  
performance:
  - max_connections: 16384
  - num_acceptors: 100
  - nodelay: true
  - reuseport: true
