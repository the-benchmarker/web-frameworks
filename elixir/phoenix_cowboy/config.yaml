framework:
  name: phoenix_cowboy
  website: https://phoenixframework.org
  version: 1.8.1
  description: "Phoenix web framework on top of Plug Cowboy"
  production_ready: true
  
features:
  - mvc_architecture
  - routing
  - templates
  - channels
  - presence
  
security:
  - csrf_protection: true
  - secure_headers: true
  - content_security_policy: true
  - secret_key_management: true
  
performance:
  - json_library: jason
  - code_reloader_disabled: true
  - asset_compilation: true
