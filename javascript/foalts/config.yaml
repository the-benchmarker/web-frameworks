framework:
  website: foalts.org
  github: FoalTS/foal
  version: 5.3

  files:
    - config/default.json
    - src/**.ts
    - tsconfig.json
    - package.json
    - cluster.mjs

  bootstrap:
    - npm install
    - npm run build

language:
  engines:
    node:
      environment:
        NODE_APP: dist/app.js
