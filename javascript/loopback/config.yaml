framework:
  website: loopback.io
  github: loopbackio/loopback-next
  version: 16.0

  files:
    - src/**.ts
    - tsconfig.json
    - package.json
    - cluster.mjs

  bootstrap:
    - npm install
    - npm run build

language:
  engines:
    node:
      environment:
        NODE_APP: dist/app.js
