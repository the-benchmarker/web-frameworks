framework:
  website: nestjs.com
  version: 12.0
  files:
    - nest-cli.json
    - src/**.ts
    - tsconfig.build.json
    - tsconfig.json
    - package.json
    - cluster.mjs

  bootstrap:
    - npm -g install @nestjs/cli
    - npm install
    - nest build

language:
  engines:
    node:
      environment:
        NODE_APP: dist/app.js
